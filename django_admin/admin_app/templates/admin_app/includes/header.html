<header class="sticky top-0 z-50 h-20 theme-card border-b theme-border px-4 sm:px-6 lg:px-8 flex items-center justify-between">

    <!-- LEFT -->
    <div class="flex items-center gap-4">
        <!-- MOBILE MENU -->
        <button type="button" onclick="toggleSidebar()" class="lg:hidden w-10 h-10 rounded-xl theme-soft theme-primary-text text-xl"> ☰ </button>

        <!-- HEADING -->
        <div>
            <h2 class="text-xl sm:text-2xl font-bold theme-dark-text"> Dashboard </h2>
            <p class="text-xs sm:text-sm theme-secondary-text"> Welcome back, Administrator </p>
        </div>
    </div>

    <!-- RIGHT -->
    <div class="flex items-center gap-3">
        <!-- ================================= -->
        <!-- THEME -->
        <!-- ================================= -->
        <div class="relative">
            <button id="themeButton" type="button" onclick="toggleThemeMenu()" class="flex items-center gap-2 px-3 sm:px-4 py-2 rounded-lg border theme-border theme-card theme-primary-text hover:shadow transition"> <span class="text-lg"> 🎨 </span> <span class="hidden sm:block font-medium"> Theme </span> </button>

            <!-- THEME MENU -->
            <div id="themeMenu" class="theme-menu hidden absolute right-0 mt-2 w-48 rounded-xl shadow-xl overflow-hidden z-50">
                <button type="button" onclick="setTheme('sky')" class="theme-menu-item w-full text-left px-4 py-3 flex items-center gap-3"> 🔵 <span>Sky Blue</span> </button>
                <button type="button" onclick="setTheme('green')" class="theme-menu-item w-full text-left px-4 py-3 flex items-center gap-3"> 🟢 <span>Green</span> </button>
                <button type="button" onclick="setTheme('purple')" class="theme-menu-item w-full text-left px-4 py-3 flex items-center gap-3"> 🟣 <span>Purple</span> </button>
                <button type="button" onclick="setTheme('orange')" class="theme-menu-item w-full text-left px-4 py-3 flex items-center gap-3"> 🟠 <span>Orange</span> </button>
                <button type="button" onclick="setTheme('red')" class="theme-menu-item w-full text-left px-4 py-3 flex items-center gap-3"> 🔴 <span>Red</span> </button>
                <button type="button" onclick="setTheme('dark')" class="theme-menu-item w-full text-left px-4 py-3 flex items-center gap-3"> 🌙 <span>Dark</span> </button>
            </div>
        </div>

        <!-- PROFILE -->
        <div class="flex items-center gap-3">
            <div class="hidden sm:block text-right">
                <p class="font-semibold text-sm theme-dark-text"> Super Admin </p>
                <p class="text-xs theme-secondary-text"> Administrator </p>
            </div>
            <div class="w-11 h-11 rounded-full theme-primary flex items-center justify-center text-white font-bold shadow-md"> SA </div>
        </div>
    </div>   
</header>
